name: Build LexiBridge Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Synchronize Web Assets to Android
        run: |
          chmod +x scripts/sync-assets.sh
          bash scripts/sync-assets.sh

      - name: Build Release APK and App Bundle (AAB for Google Play)
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          cd android
          ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Prepare Artifacts for Release
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk LexiBridge.apk
          if [ -f android/app/build/outputs/bundle/release/app-release.aab ]; then
            cp android/app/build/outputs/bundle/release/app-release.aab LexiBridge.aab
          fi

      - name: Upload APK and AAB Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LexiBridge-Android-Builds
          path: |
            LexiBridge.apk
            LexiBridge.aab
          retention-days: 30

      - name: Create GitHub Release with APK & AAB
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        with:
          files: |
            LexiBridge.apk
            LexiBridge.aab
          tag_name: v1.0.0
          name: LexiBridge v1.0.0 Android APK & AAB
          body: |
            ### 📱 LexiBridge Android (v1.0.0)
            Felemenkçe ↔ Türkçe AI Destekli Sözlük Mobil Uygulaması.
            
            - **LexiBridge.apk:** Doğrudan telefona kurmak için (Sideload / Doğrudan Kurulum).
            - **LexiBridge.aab:** Google Play Store Console yüklemesi için (Android App Bundle).
            - **Tam Çevrimdışı Önbellek:** Daha önce aranan kelimeler internetsiz anında açılır.
            - **Gizlilik Odaklı (BYOK):** Kişisel veri toplanmaz; API anahtarı sadece yerel cihazda durur.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
